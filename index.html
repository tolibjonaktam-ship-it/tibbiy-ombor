<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedStock ERP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#eef2f7;color:#1f2a37}
.header{background:#0f3d5e;color:#fff;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.header h1{font-size:19px;display:flex;align-items:center;gap:8px}
.header .right{display:flex;align-items:center;gap:14px;font-size:13px}
.header .right b{font-weight:600}
.logout{background:#c0392b;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.nav{background:#15517a;display:flex;gap:4px;padding:7px 18px;flex-wrap:wrap}
.nav button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25);padding:8px 15px;border-radius:6px;cursor:pointer;font-size:13.5px;transition:.15s}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.2);border-color:#fff}
.content{padding:20px;max-width:1500px;margin:0 auto}
.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card h2{color:#0f3d5e;margin-bottom:14px;font-size:17px;border-bottom:2px solid #eef2f7;padding-bottom:9px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.stats{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:18px}
.stat-card{background:#fff;border-radius:10px;padding:18px;flex:1;min-width:155px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-left:4px solid #15517a}
.stat-card .value{font-size:24px;font-weight:700;color:#0f3d5e}
.stat-card .label{font-size:12px;color:#6b7785;margin-top:4px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px;margin-bottom:14px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:12.5px;color:#54616e;font-weight:600}
input,select,textarea{padding:8px 11px;border:1px solid #d3dae3;border-radius:6px;font-size:13.5px;outline:none;transition:.15s;background:#fff}
input:focus,select:focus,textarea:focus{border-color:#15517a;box-shadow:0 0 0 2px rgba(21,81,122,.12)}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13.5px;font-weight:600;transition:.15s}
.btn:hover{opacity:.9}
.btn-primary{background:#0f3d5e;color:#fff}.btn-success{background:#1e8449;color:#fff}
.btn-warning{background:#d35400;color:#fff}.btn-danger{background:#c0392b;color:#fff}
.btn-info{background:#2471a3;color:#fff}.btn-light{background:#e5eaf0;color:#333}
.btn-sm{padding:4px 9px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#0f3d5e;color:#fff;padding:9px 10px;text-align:left;white-space:nowrap;position:sticky;top:0}
td{padding:7px 10px;border-bottom:1px solid #eef2f7;white-space:nowrap}
tr:hover{background:#f6f9fc}
.tbl-wrap{overflow-x:auto;border:1px solid #eef2f7;border-radius:8px}
.badge{padding:3px 10px;border-radius:14px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-prodaja{background:#eafaf1;color:#1e8449;border:1px solid #82e0aa}
.b-vozvrat{background:#fdedec;color:#c0392b;border:1px solid #f1948a}
.b-otpravlen{background:#eaf2fb;color:#2471a3;border:1px solid #85c1e9}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;overflow-y:auto}
.modal.show{display:flex;align-items:flex-start;justify-content:center;padding:30px 15px}
.modal-box{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:760px;margin-top:10px}
.modal-box h3{color:#0f3d5e;margin-bottom:18px;font-size:17px}
.modal-footer{margin-top:18px;display:flex;gap:9px;justify-content:flex-end}
.search-bar{width:260px}
.filter-bar{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.spacer{margin-left:auto}
/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f3d5e,#15517a)}
.login-box{background:#fff;border-radius:14px;padding:36px;width:360px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.login-box h2{color:#0f3d5e;text-align:center;margin-bottom:6px}
.login-box p{text-align:center;color:#8a96a3;font-size:13px;margin-bottom:22px}
.login-box .form-group{margin-bottom:14px}
.login-box .btn{width:100%;padding:11px}
.err{color:#c0392b;font-size:13px;margin-top:10px;text-align:center;min-height:18px}
.muted{color:#8a96a3;font-size:12px}
.top-rank{background:#fef9e7;font-weight:700}
.charts{display:grid;grid-template-columns:2fr 1fr;gap:18px}
@media(max-width:900px){.charts{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:14px;height:200px;padding:10px 4px;border-bottom:2px solid #e0e6ee}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bar{width:70%;max-width:48px;background:linear-gradient(180deg,#2471a3,#0f3d5e);border-radius:5px 5px 0 0;min-height:3px;transition:.3s;position:relative}
.bar:hover{opacity:.85}
.bar-val{font-size:11px;color:#0f3d5e;font-weight:700}
.bar-lbl{font-size:11px;color:#6b7785;margin-top:6px}
.donut-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.dot{width:13px;height:13px;border-radius:50%;flex-shrink:0}
@media print{.header,.nav,.filter-bar,.btn{display:none!important}.card{box-shadow:none}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <h2>MedStock ERP</h2>
    <p>Ombor, sotuv va qaytarish tizimi</p>
    <div class="form-group"><label>Login</label><input id="lgU" placeholder="admin" autocomplete="username"></div>
    <div class="form-group"><label>Parol</label><input id="lgP" type="password" placeholder="••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-primary" onclick="doLogin()">Kirish</button>
    <div class="err" id="lgErr"></div>
    <div class="muted" style="text-align:center;margin-top:14px">Standart: admin / admin123</div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="header">
    <h1>🦴 MedStock ERP</h1>
    <div class="right">
      <span id="clock"></span>
      <span>👤 <b id="hdrUser"></b> <span id="hdrRole" class="muted"></span></span>
      <button class="logout" style="background:#15517a" onclick="pwForm()">Parol</button>
      <button class="logout" onclick="logout()">Chiqish</button>
    </div>
  </div>
  <div class="nav" id="nav"></div>
  <div class="content" id="content"></div>
</div>

<div class="modal" id="modal"><div class="modal-box" id="mc"></div></div>

<script>
const API = location.origin + '/api';
let TOKEN = localStorage.getItem('ms_token') || '';
let USER = JSON.parse(localStorage.getItem('ms_user') || 'null');

/* ---------- helpers ---------- */
function pul(n){return Number(n||0).toLocaleString('uz-UZ')+" so'm";}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function moch(h){document.getElementById('mc').innerHTML=h;document.getElementById('modal').classList.add('show');}
function myop(){document.getElementById('modal').classList.remove('show');}
function val(id){const e=document.getElementById(id);return e?e.value:'';}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)myop();});

async function api(u,m='GET',d=null){
  const o={method:m,headers:{'Content-Type':'application/json'}};
  if(TOKEN)o.headers['Authorization']='Bearer '+TOKEN;
  if(d)o.body=JSON.stringify(d);
  const r=await fetch(API+u,o);
  if(r.status===401){logout();throw new Error('401');}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Xatolik');
  return j;
}
function isAdmin(){return USER&&USER.role==='admin';}

/* ---------- auth ---------- */
async function doLogin(){
  document.getElementById('lgErr').textContent='';
  try{
    const r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:val('lgU'),password:val('lgP')})});
    const j=await r.json();
    if(!r.ok){document.getElementById('lgErr').textContent=j.error||'Xatolik';return;}
    TOKEN=j.token;USER=j.user;
    localStorage.setItem('ms_token',TOKEN);localStorage.setItem('ms_user',JSON.stringify(USER));
    startApp();
  }catch(e){document.getElementById('lgErr').textContent='Server bilan aloqa yo\'q';}
}
function logout(){
  TOKEN='';USER=null;localStorage.removeItem('ms_token');localStorage.removeItem('ms_user');
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
}

/* ---------- nav ---------- */
const PAGES=[
  {k:'dash',t:'Dashboard',f:dash},
  {k:'oper',t:'Operatsiyalar',f:oper},
  {k:'mah',t:'Mahsulotlar',f:mah},
  {k:'kon',t:'Kontragentlar',f:kon},
  {k:'kpi',t:'Menejer KPI',f:kpi},
  {k:'hisobot',t:'Hisobotlar',f:hisobot},
  {k:'users',t:'Foydalanuvchilar',f:users,admin:true},
  {k:'audit',t:'Audit log',f:audit,admin:true},
];
function buildNav(){
  const nav=document.getElementById('nav');nav.innerHTML='';
  PAGES.filter(p=>!p.admin||isAdmin()).forEach((p,i)=>{
    const b=document.createElement('button');b.textContent=p.t;
    b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');p.f();};
    if(i===0)b.classList.add('active');
    nav.appendChild(b);
  });
}
function startApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('hdrUser').textContent=USER.full_name||USER.username;
  document.getElementById('hdrRole').textContent='('+(USER.role==='admin'?'Admin':'Menejer')+')';
  buildNav();dash();
}
setInterval(()=>{const c=document.getElementById('clock');if(c)c.textContent=new Date().toLocaleString('uz-UZ');},1000);

/* ============== DASHBOARD ============== */
async function dash(){
  const h=await api('/dashboard');
  let pw='';
  if(h.past_qoldiq&&h.past_qoldiq.length){
    pw='<div class="card"><h2>⚠️ Kam qoldiq (5 va undan kam)</h2><div class="tbl-wrap"><table><tr><th>Artikul</th><th>Nomi</th><th>Birlik</th><th>Qoldiq</th></tr>'+
    h.past_qoldiq.map(p=>'<tr><td>'+esc(p.artikul)+'</td><td>'+esc(p.nomi)+'</td><td>'+esc(p.birlik)+'</td><td style="color:#c0392b;font-weight:700">'+p.qoldiq+'</td></tr>').join('')+'</table></div></div>';
  }
  let charts='';
  try{charts=await dashCharts();}catch(e){}
  document.getElementById('content').innerHTML=
  '<div class="stats">'+
  st(h.jami_mahsulot,'Jami mahsulotlar')+
  st(h.jami_qoldiq,'Jami qoldiq (dona)')+
  st(pul(h.bugungi_sotuv),'Bugungi sotuv','#1e8449')+
  st(pul(h.oylik_sotuv),'Oylik sotuv','#2471a3')+
  st(h.qaytarilgan,'Qaytarilgan (dona)','#c0392b')+
  st(pul(h.foyda),'Foyda','#7d3c98')+
  '</div>'+charts+pw;
}
async function dashCharts(){
  const c=await api('/charts');
  const max=Math.max(1,...c.oylik.map(o=>o.summa));
  const bars=c.oylik.map(o=>{
    const hpc=Math.round(o.summa/max*100);
    const lbl=o.oy.slice(5)+'.'+o.oy.slice(2,4);
    return '<div class="bar-col"><div class="bar-val">'+(o.summa?(o.summa/1000000>=1?(o.summa/1000000).toFixed(1)+'M':Math.round(o.summa/1000)+'k'):'')+'</div><div class="bar" style="height:'+hpc+'%" title="'+pul(o.summa)+'"></div><div class="bar-lbl">'+lbl+'</div></div>';
  }).join('');
  const colors={'Продажа':'#1e8449','Возврат':'#c0392b','Отправлен':'#2471a3'};
  const totS=c.statuslar.reduce((a,s)=>a+s.n,0)||1;
  const legend=c.statuslar.length?c.statuslar.map(s=>'<div class="donut-row"><span class="dot" style="background:'+(colors[s.status]||'#888')+'"></span><span>'+esc(s.status)+'</span><b style="margin-left:auto">'+s.n+' ('+Math.round(s.n/totS*100)+'%)</b></div>').join(''):'<p class="muted">Ma\'lumot yo\'q</p>';
  return '<div class="charts">'+
    '<div class="card"><h2>📊 Oylik sotuv (oxirgi 6 oy)</h2><div class="bars">'+bars+'</div></div>'+
    '<div class="card"><h2>🥧 Operatsiyalar statusi</h2>'+legend+'</div>'+
    '</div>';
}
function st(v,l,c){return '<div class="stat-card"><div class="value"'+(c?' style="color:'+c+'"':'')+'>'+v+'</div><div class="label">'+l+'</div></div>';}

/* ============== OPERATSIYALAR ============== */
let MAHS=[],KONS=[];
async function loadRefs(){MAHS=await api('/mahsulotlar');KONS=await api('/kontragentlar');}
async function oper(q=''){
  await loadRefs();
  let ops=await api('/operatsiyalar');
  if(q){const s=q.toLowerCase();ops=ops.filter(o=>(o.nomi||'').toLowerCase().includes(s)||(o.artikul||'').toLowerCase().includes(s)||(o.kontragent||'').toLowerCase().includes(s)||(o.zakaz_nomer||'').toLowerCase().includes(s)||(o.menejer||'').toLowerCase().includes(s));}
  document.getElementById('content').innerHTML=
  '<div class="card"><h2>Operatsiyalar moduli'+
  '<span><button class="btn btn-light btn-sm" onclick="exp(\'operatsiyalar\')">⬇ Excel</button> <button class="btn btn-light btn-sm" onclick="window.print()">🖨 PDF</button></span></h2>'+
  '<div class="filter-bar"><input class="search-bar" placeholder="🔍 Tez qidiruv (artikul, mijoz, zakaz...)" oninput="oper(this.value)" value="'+esc(q)+'"><button class="btn btn-success spacer" onclick="operForm()">+ Yangi operatsiya</button></div>'+
  '<div class="tbl-wrap"><table><tr>'+
  ['Склад','Артикул','Наименование','Остаток','Отгр','Возвр','Продажа','Себест','Сумма продаж','Заказ №','Статус','Договор','Контрагент','Дата отгр','Дата продаж','Менеджер',''].map(h=>'<th>'+h+'</th>').join('')+'</tr>'+
  ops.map(o=>'<tr>'+
    '<td>'+esc(o.sklad)+'</td><td><b>'+esc(o.artikul)+'</b></td><td>'+esc(o.nomi)+'</td>'+
    '<td>'+(o.ostatok==null?'-':o.ostatok)+'</td><td>'+o.otgr_kol+'</td><td>'+o.vozvrat_kol+'</td>'+
    '<td><b>'+o.prodaja+'</b></td><td>'+pul(o.sebest)+'</td><td><b>'+pul(o.summa_prodaj)+'</b></td>'+
    '<td>'+esc(o.zakaz_nomer)+'</td><td>'+badge(o.status)+'</td><td>'+esc(o.dogovor)+'</td>'+
    '<td>'+esc(o.kontragent)+'</td><td>'+esc(o.data_otgr)+'</td><td>'+esc(o.data_prodaj)+'</td>'+
    '<td>'+esc(o.menejer)+'</td>'+
    '<td><button class="btn btn-info btn-sm" onclick="operForm('+o.id+')">✎</button> <button class="btn btn-danger btn-sm" onclick="operDel('+o.id+')">🗑</button></td>'+
  '</tr>').join('')+'</table></div>'+
  (ops.length?'':'<p class="muted" style="padding:14px">Hozircha operatsiyalar yo\'q.</p>')+'</div>';
}
function badge(s){const m={'Продажа':'b-prodaja','Возврат':'b-vozvrat','Отправлен':'b-otpravlen'};return '<span class="badge '+(m[s]||'b-otpravlen')+'">'+esc(s)+'</span>';}

function operForm(id){
  const o=id?window._ops_cache.find(x=>x.id===id):{};
  const cur=o||{};
  const mahOpt=MAHS.map(m=>'<option value="'+m.id+'" data-tannarx="'+m.tannarx+'" data-narx="'+m.sotuv_narx+'" data-ost="'+m.qoldiq+'" '+(cur.mahsulot_id===m.id?'selected':'')+'>'+esc(m.artikul||('#'+m.id))+' — '+esc(m.nomi)+' (qoldiq:'+m.qoldiq+')</option>').join('');
  const konOpt='<option value="">--</option>'+KONS.map(k=>'<option value="'+k.id+'" data-sklad="'+esc(k.sklad)+'" data-men="'+esc(k.menejer)+'" '+(cur.kontragent_id===k.id?'selected':'')+'>'+esc(k.nomi)+'</option>').join('');
  const statOpt=['Отправлен','Продажа','Возврат'].map(s=>'<option '+(cur.status===s?'selected':'')+'>'+s+'</option>').join('');
  moch('<h3>'+(id?'Operatsiyani tahrirlash':'Yangi operatsiya')+'</h3>'+
  '<div class="form-grid">'+
  '<div class="form-group" style="grid-column:span 2"><label>Артикул / Mahsulot *</label><select id="op_m" onchange="opFill()">'+'<option value="">-- Tanlang --</option>'+mahOpt+'</select></div>'+
  '<div class="form-group"><label>Остаток</label><input id="op_ost" disabled></div>'+
  '<div class="form-group"><label>Наименование</label><input id="op_nom" disabled></div>'+
  '<div class="form-group"><label>Отгр количество</label><input id="op_otgr" type="number" value="'+(cur.otgr_kol||0)+'" oninput="opCalc()"></div>'+
  '<div class="form-group"><label>Возврат количество</label><input id="op_voz" type="number" value="'+(cur.vozvrat_kol||0)+'" oninput="opCalc()"></div>'+
  '<div class="form-group"><label>Продажа (avto)</label><input id="op_pro" disabled></div>'+
  '<div class="form-group"><label>Себестоимость</label><input id="op_seb" type="number" value="'+(cur.sebest||'')+'" oninput="opCalc()"></div>'+
  '<div class="form-group"><label>Цена продажи</label><input id="op_narx" type="number" value="'+(cur.sotuv_narx||'')+'" oninput="opCalc()"></div>'+
  '<div class="form-group"><label>Сумма продаж (avto)</label><input id="op_sum" disabled></div>'+
  '<div class="form-group"><label>Статус</label><select id="op_stat">'+statOpt+'</select></div>'+
  '<div class="form-group"><label>Заказ номер</label><input id="op_zak" value="'+esc(cur.zakaz_nomer)+'"></div>'+
  '<div class="form-group"><label>Договор</label><input id="op_dog" value="'+esc(cur.dogovor)+'"></div>'+
  '<div class="form-group"><label>Контрагент</label><select id="op_k" onchange="opKon()">'+konOpt+'</select></div>'+
  '<div class="form-group"><label>Склад</label><input id="op_skl" value="'+esc(cur.sklad)+'"></div>'+
  (isAdmin()?'<div class="form-group"><label>Менеджер</label><input id="op_men" value="'+esc(cur.menejer||USER.username)+'"></div>':'')+
  '</div>'+
  '<div class="modal-footer"><button class="btn btn-success" onclick="operSave('+(id||0)+')">Saqlash</button><button class="btn btn-light" onclick="myop()">Bekor</button></div>');
  opFill(true);opCalc();
}
function opFill(keep){
  const s=document.getElementById('op_m');const o=s.options[s.selectedIndex];
  if(!o||!s.value){return;}
  document.getElementById('op_ost').value=o.dataset.ost||0;
  document.getElementById('op_nom').value=o.text.split(' — ')[1]?o.text.split(' — ')[1].split(' (qoldiq')[0]:'';
  if(!keep){
    document.getElementById('op_seb').value=o.dataset.tannarx||0;
    document.getElementById('op_narx').value=o.dataset.narx||0;
  }else{
    if(!val('op_seb'))document.getElementById('op_seb').value=o.dataset.tannarx||0;
    if(!val('op_narx'))document.getElementById('op_narx').value=o.dataset.narx||0;
  }
  opCalc();
}
function opKon(){
  const s=document.getElementById('op_k');const o=s.options[s.selectedIndex];
  if(o&&o.dataset){if(!val('op_skl'))document.getElementById('op_skl').value=o.dataset.sklad||'';
    const men=document.getElementById('op_men');if(men&&!men.value)men.value=o.dataset.men||'';}
}
function opCalc(){
  const otgr=parseInt(val('op_otgr'))||0,voz=parseInt(val('op_voz'))||0;
  const pro=otgr-voz;const narx=parseFloat(val('op_narx'))||0;
  document.getElementById('op_pro').value=pro;
  document.getElementById('op_sum').value=(pro*narx).toLocaleString('uz-UZ');
}
async function operSave(id){
  const mid=val('op_m');
  if(!mid){alert('Mahsulot (artikul) tanlang!');return;}
  const d={mahsulot_id:parseInt(mid),otgr_kol:parseInt(val('op_otgr'))||0,vozvrat_kol:parseInt(val('op_voz'))||0,
    sebest:parseFloat(val('op_seb'))||0,sotuv_narx:parseFloat(val('op_narx'))||0,status:val('op_stat'),
    zakaz_nomer:val('op_zak'),dogovor:val('op_dog'),kontragent_id:val('op_k')?parseInt(val('op_k')):null,
    sklad:val('op_skl')};
  if(isAdmin())d.menejer=val('op_men');
  try{
    if(id)await api('/operatsiyalar/'+id,'PUT',d);else await api('/operatsiyalar','POST',d);
    myop();oper();
  }catch(e){alert('Xato: '+e.message);}
}
async function operDel(id){

/* ============== EXPORT ============== */
async function exp(turi,fmt){
  fmt=fmt||'xlsx';
  const path=fmt==='xlsx'?'/xlsx/':'/export/';
  const r=await fetch(API+path+turi,{headers:{'Authorization':'Bearer '+TOKEN}});
  if(!r.ok){alert('Export xatosi');return;}
  const blob=await r.blob();const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=turi+'.'+fmt;a.click();URL.revokeObjectURL(url);
}
